[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "../deployments" }, { access = "read", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 128
depth = 60
fail_on_revert = false

[fmt]
line_length = 110

[lint]
lint_on_build = false
